<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>报表与质控 - 项目专员端</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .report-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;
        }
        .chart-box {
            background: white; border-radius: 20px; padding: 20px; margin-bottom: 16px;
            border: 1px solid #F0F2F5; position: relative;
        }
        .mini-chart {
            height: 100px; display: flex; align-items: flex-end; gap: 8px; margin-top: 16px;
        }
        .chart-bar {
            flex: 1; background: var(--primary-soft); border-radius: 4px; transition: height 1s;
            position: relative;
        }
        .chart-bar::after {
            content: attr(data-label); position: absolute; bottom: -20px; left: 50%;
            transform: translateX(-50%); font-size: 10px; color: var(--text-muted);
        }
        .chart-bar.active { background: var(--primary-gradient); }

        .report-item {
            display: flex; align-items: center; gap: 16px; padding: 16px 0;
            border-bottom: 1px solid #F0F2F5;
        }
        .report-item:last-child { border-bottom: none; }
        .file-icon {
            width: 44px; height: 44px; border-radius: 12px; background: #F0F2F5;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .risk-analysis-card {
            display: flex; align-items: center; justify-content: space-between; gap: 18px;
            padding: 22px 20px;
        }
        .risk-pie {
            width: 148px; height: 148px; border-radius: 50%;
            background: conic-gradient(#FF4D4F 0 14.3%, #FAAD14 14.3% 45.3%, #2BA471 45.3% 100%);
            position: relative; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
        }
        .risk-pie::after {
            content: "84\A患者";
            white-space: pre; position: absolute; inset: 32px; border-radius: 50%;
            background: #fff; display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 15px; line-height: 1.4; font-weight: 700; color: var(--text-main);
            box-shadow: 0 4px 12px rgba(20, 42, 35, 0.08);
        }
        .risk-legend { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .risk-legend-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .risk-name { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 13px; }
        .risk-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .risk-value { font-weight: 700; color: var(--text-main); font-size: 14px; text-align: right; }
        .risk-value small { display: block; font-size: 10px; color: var(--text-muted); font-weight: 500; margin-top: 1px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="back-btn" onclick="location.href='index.html'">✕</div>
        <h1>报表与质控中心</h1>
    </div>

    <div class="container">
        <!-- 核心统计 -->
        <div class="report-grid animate-up">
            <div class="card" style="margin-bottom:0">
                <div style="font-size: 12px; color: var(--text-muted);">红灯患者数</div>
                <div style="font-size: 24px; font-weight: 700; color: #FF4D4F; margin: 4px 0;">12人</div>
                <div style="font-size: 11px; color: var(--text-secondary);">占比 14.3%</div>
            </div>
            <div class="card" style="margin-bottom:0">
                <div style="font-size: 12px; color: var(--text-muted);">黄灯患者数</div>
                <div style="font-size: 24px; font-weight: 700; color: #FAAD14; margin: 4px 0;">26人</div>
                <div style="font-size: 11px; color: var(--text-secondary);">占比 31.0%</div>
            </div>
            <div class="card" style="margin-bottom:0">
                <div style="font-size: 12px; color: var(--text-muted);">随访逾期率</div>
                <div style="font-size: 24px; font-weight: 700; color: var(--danger-color); margin: 4px 0;">3.1%</div>
                <div style="font-size: 11px; color: var(--text-secondary);">较上月下降 0.5% ↓</div>
            </div>
            <div class="card" style="margin-bottom:0; cursor: pointer;" onclick="App.navigateTo('satisfaction-list.html')">
                <div style="font-size: 12px; color: var(--text-muted);">服务满意度</div>
                <div style="font-size: 24px; font-weight: 700; color: #FF9500; margin: 4px 0;">4.9</div>
                <div style="font-size: 11px; color: var(--text-secondary);">共 42 条评价 ›</div>
            </div>
        </div>

        <!-- 入组趋势图表 -->
        <div class="chart-box animate-up" style="animation-delay: 0.1s; margin-bottom: 24px;">
            <h3 style="font-size: 15px; font-weight: 700;">入组趋势 (近6月)</h3>
            <div class="mini-chart">
                <div class="chart-bar" style="height: 30%" data-label="11月"></div>
                <div class="chart-bar" style="height: 45%" data-label="12月"></div>
                <div class="chart-bar" style="height: 60%" data-label="1月"></div>
                <div class="chart-bar" style="height: 55%" data-label="2月"></div>
                <div class="chart-bar" style="height: 80%" data-label="3月"></div>
                <div class="chart-bar active" style="height: 95%" data-label="4月"></div>
            </div>
            <div style="margin-top: 30px; display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted);">
                <span>目标：120 标本</span>
                <span>当前：84 标本 (70%)</span>
            </div>
        </div>

        <!-- 患者风险状态分析 -->
        <div class="section-title animate-up" style="animation-delay: 0.2s;" id="reports">
            患者风险状态分析
        </div>
        <div class="card risk-analysis-card animate-up" style="animation-delay: 0.25s;">
            <div class="risk-pie" aria-label="红灯12人，黄灯26人，绿灯46人"></div>
            <div class="risk-legend">
                <div class="risk-legend-item">
                    <div class="risk-name"><span class="risk-dot" style="background:#FF4D4F"></span>红灯患者</div>
                    <div class="risk-value">12人<small>14.3%</small></div>
                </div>
                <div class="risk-legend-item">
                    <div class="risk-name"><span class="risk-dot" style="background:#FAAD14"></span>黄灯患者</div>
                    <div class="risk-value">26人<small>31.0%</small></div>
                </div>
                <div class="risk-legend-item">
                    <div class="risk-name"><span class="risk-dot" style="background:#2BA471"></span>绿灯患者</div>
                    <div class="risk-value">46人<small>54.7%</small></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部 Tab 栏 -->
    <nav class="tab-bar">
        <a href="index.html" class="tab-item">
            <span class="tab-icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="task-list.html" class="tab-item">
            <span class="tab-icon" style="position: relative;">📋 <span class="badge">14</span></span>
            <span>任务管理</span>
        </a>
        <a href="patient-list.html" class="tab-item">
            <span class="tab-icon">👥</span>
            <span>患者管理</span>
        </a>
        <a href="report-center.html" class="tab-item active">
            <span class="tab-icon">📊</span>
            <span>数据报表</span>
        </a>
        <a href="my.html" class="tab-item">
            <span class="tab-icon">👤</span>
            <span>我的</span>
        </a>
    </nav>
</body>
</html>
