<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>随访执行 - 项目专员端</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
    .top-card {
      background: linear-gradient(135deg, #EAF7F1 0%, #FFFFFF 100%);
      border: 1px solid rgba(43, 164, 113, 0.18);
      border-radius: 20px; padding: 16px; margin-bottom: 14px;
      box-shadow: var(--shadow-md);
    }
    .patient-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .patient-main { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--primary-gradient); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px;
    }
    .patient-name { font-size: 17px; font-weight: 800; color: var(--text-main); }
    .patient-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .task-type-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .report-card {
      border-radius: 18px; padding: 14px 16px; margin-bottom: 14px;
      background: linear-gradient(135deg, #FDEEEE 0%, #FFFFFF 100%);
      border: 1px solid rgba(213, 73, 65, .3);
    }
    .report-title { font-size: 13px; font-weight: 800; color: var(--danger-color); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .report-text { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }

    .module-head {
      display: flex; align-items: center; gap: 10px; margin: 22px 0 12px;
    }
    .module-icon {
      width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
      background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 17px;
    }
    .module-title { font-size: 16px; font-weight: 800; color: var(--text-main); }
    .module-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .module-block.cond-hidden { display: none; }

    .sys-field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .sys-field {
      background: rgba(255,255,255,.8); border: 1px solid #EEF1F4; border-radius: 12px; padding: 9px 12px;
    }
    .sys-field .k { font-size: 10px; color: var(--text-muted); }
    .sys-field .v { font-size: 13px; font-weight: 700; color: var(--text-main); margin-top: 2px; }

    .question-card {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-md);
    }
    .question-card.branch { border-left: 3px solid var(--danger-color); }
    .question-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .question-no {
      flex: 0 0 auto; min-width: 40px; height: 24px; padding: 0 8px;
      border-radius: 999px; background: var(--primary-soft); color: var(--primary-color);
      display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800;
    }
    .question-title { flex: 1; font-size: 14px; font-weight: 700; color: var(--text-main); line-height: 1.55; }
    .required { color: var(--danger-color); margin-left: 3px; }
    .script-btn {
      flex: 0 0 auto; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 3px;
      padding: 4px 9px; border-radius: 999px;
      background: #FFF7E6; color: #AD4E00; font-size: 11px; font-weight: 700;
    }
    .script-btn:active { transform: scale(0.95); }
    .option-list { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .option-item {
      position: relative; display: flex; gap: 9px; align-items: flex-start;
      min-height: 42px; padding: 11px 12px;
      border-radius: 13px; border: 1px solid #E5E6EB;
      background: rgba(255,255,255,.75); font-size: 13px; color: var(--text-secondary);
      transition: all .18s ease; cursor: pointer;
    }
    .option-item input { margin-top: 2px; width: 16px; height: 16px; accent-color: var(--primary-color); flex: 0 0 auto; }
    .option-item.checked { border-color: rgba(43,164,113,.55); background: var(--primary-soft); color: var(--text-main); }
    .option-item.preselect { border-color: rgba(227,115,24,.5); background: #FFF7E6; color: #AD4E00; }
    .option-item .urgent-dot {
      flex: 0 0 auto; font-size: 10px; color: var(--danger-color); font-weight: 800;
      border: 1px solid rgba(213,73,65,.4); border-radius: 4px; padding: 0 4px; margin-top: 1px;
    }
    .option-text { flex: 1; line-height: 1.45; word-break: break-word; }
    .text-input, .date-input, .extra-input {
      width: 100%; padding: 12px 14px;
      border: 1px solid #E5E6EB; border-radius: 13px;
      font-family: inherit; font-size: 14px; color: var(--text-main);
      background: rgba(255,255,255,.75); outline: none;
    }
    .extra-input { min-height: 80px; resize: none; }
    .text-input:focus, .date-input:focus, .extra-input:focus { border-color: var(--primary-color); background: #fff; }
    .safety-hint {
      margin-top: 10px; font-size: 11px; color: #AD4E00; background: #FFF7E6;
      border-radius: 10px; padding: 8px 12px; line-height: 1.6;
    }
    .safety-hint.ok { color: var(--primary-color); background: var(--primary-light); }
    .cond-note {
      margin-top: 10px; font-size: 12px; color: var(--info-color); background: #E8F3FF;
      border-radius: 10px; padding: 8px 12px; line-height: 1.6;
    }
    .error-tip { display: none; color: var(--danger-color); font-size: 12px; margin-top: 8px; }
    .question-card.error { border-color: rgba(213,73,65,.45); }
    .question-card.error .error-tip { display: block; }

    /* 紧急升级横幅 */
    .urgent-banner {
      position: fixed; left: 0; right: 0; bottom: calc(84px + var(--safe-area-bottom));
      max-width: 500px; margin: 0 auto; padding: 0 16px; z-index: 99;
    }
    .urgent-banner-inner {
      background: linear-gradient(135deg, #D54941 0%, #B22222 100%);
      color: white; border-radius: 16px; padding: 12px 16px;
      display: flex; gap: 10px; align-items: flex-start;
      box-shadow: 0 12px 32px rgba(213,73,65,.4);
      animation: urgentPulse 1.2s ease-in-out infinite;
    }
    @keyframes urgentPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.015); } }
    .urgent-banner .u-icon { font-size: 22px; line-height: 1.2; }
    .urgent-banner .u-title { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
    .urgent-banner .u-text { font-size: 12px; opacity: .92; line-height: 1.5; }

    /* 话术弹层 */
    .sheet-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1500;
      display: none; align-items: flex-end; justify-content: center;
    }
    .sheet-mask.active { display: flex; }
    .sheet {
      width: 100%; max-width: 500px; background: white;
      border-radius: 24px 24px 0 0; padding: 20px 20px calc(24px + var(--safe-area-bottom));
      animation: slideUp .28s ease;
    }
    .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: #E5E6EB; margin: 0 auto 14px; }
    .sheet-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .sheet-q { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .sheet-script {
      background: #FFF7E6; border-radius: 14px; padding: 14px 16px;
      font-size: 14px; color: #7A3E00; line-height: 1.8;
    }
    .sheet-close {
      margin-top: 16px; width: 100%; height: 44px; border: none; border-radius: 14px;
      background: var(--primary-soft); color: var(--primary-color); font-size: 14px; font-weight: 700;
    }

    .progress-line {
      position: sticky; top: 64px; z-index: 90;
      background: rgba(245,247,250,.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 8px 0 10px; margin-bottom: 4px;
    }
    .progress-text { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .progress-track { height: 7px; border-radius: 999px; background: #E5E6EB; overflow: hidden; }
    .progress-bar { height: 100%; width: 0; border-radius: inherit; background: var(--primary-gradient); transition: width .25s ease; }

    .btn-group {
      position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto;
      padding: 14px 20px; padding-bottom: calc(14px + var(--safe-area-bottom));
      background: rgba(255,255,255,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid #F0F2F5; z-index: 100;
    }
    .btn-primary {
      width: 100%; height: 50px; border-radius: 16px; border: none; cursor: pointer;
      background: var(--primary-gradient); color: #fff;
      font-size: 16px; font-weight: 800; box-shadow: var(--shadow-lg);
    }
    .btn-primary:active { transform: scale(.98); opacity: .92; }
  </style>
</head>
<body>
  <div class="header">
    <div class="back-btn" onclick="history.back()">✕</div>
    <h1 id="pageTitle">随访执行</h1>
    <div style="width: 32px;"></div>
  </div>

  <div class="container" style="padding-bottom: 130px;">
    <!-- 患者与任务信息 -->
    <div class="top-card animate-up">
      <div class="patient-row">
        <div class="patient-main">
          <div class="avatar" id="patientAvatar">?</div>
          <div>
            <div class="patient-name" id="patientName">--</div>
            <div class="patient-meta" id="patientMeta">--</div>
          </div>
        </div>
        <span class="task-type-tag" id="taskTypeTag">--</span>
      </div>
    </div>

    <!-- AE 即时随访：患者上报描述 -->
    <div class="report-card hidden" id="reportCard">
      <div class="report-title"><span>🚨 患者上报的不适描述</span><span id="reportTime"></span></div>
      <div class="report-text" id="reportText"></div>
    </div>

    <div class="progress-line">
      <div class="progress-text"><span id="progressText">已完成 0 / 0</span><span id="progressMode">必填项</span></div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div id="formRoot"></div>
  </div>

  <!-- 紧急升级线索横幅 -->
  <div class="urgent-banner hidden" id="urgentBanner">
    <div class="urgent-banner-inner">
      <div class="u-icon">🚨</div>
      <div>
        <div class="u-title">检测到紧急升级线索</div>
        <div class="u-text">建议提醒患者尽快就医，并同步项目经理 / PV 接口人。</div>
      </div>
    </div>
  </div>

  <div class="btn-group">
    <button type="button" class="btn-primary" id="submitBtn" onclick="submitForm()">提交随访记录</button>
  </div>

  <!-- 话术弹层 -->
  <div class="sheet-mask" id="scriptSheet" onclick="if(event.target===this) closeScript()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">📖 参考话术</div>
      <div class="sheet-q" id="sheetQ"></div>
      <div class="sheet-script" id="sheetScript"></div>
      <button class="sheet-close" onclick="closeScript()">收起</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    /* ================= 问卷题库（对齐 V0.4 问卷库，含话术/跳转/紧急线索） ================= */
    const Q = {
      // 建档信息确认
      q9:  { no:'Q9', module:'profile', type:'radio', required:true, title:'本次随访结果',
             script:'我先确认一下，本次随访是否已经完成。',
             options:[{v:'随访完成'},{v:'部分完成'},{v:'未联系到', action:'skipSummary'},{v:'患者拒绝随访', action:'withdraw'},{v:'其他'}] },
      q10: { no:'Q10', module:'profile', type:'radio', required:true, title:'随访对象',
             script:'请问现在填写或接听的是患者本人，还是患者授权的家属？',
             options:[{v:'患者本人'},{v:'授权家属', show:['q11']},{v:'医护人员', show:['q11']},{v:'其他', show:['q11']}] },
      q11: { no:'Q11', module:'profile', type:'text', required:true, title:'随访对象关系/身份', hidden:true,
             script:'请问您与患者是什么关系，方便我准确记录。', placeholder:'如：患者女儿' },
      // 基础疾病与治疗信息
      q19: { no:'Q19', module:'base', type:'text', required:true, title:'癌种/适应症',
             script:'我先帮您核对一下疾病信息，主要是为了后续随访不漏掉关键节点。', placeholder:'按患者或院内记录填写' },
      q20: { no:'Q20', module:'base', type:'radio', required:true, title:'治疗阶段',
             script:'我帮您确认一下目前处于哪个治疗阶段。',
             options:[{v:'初始治疗'},{v:'维持治疗'},{v:'复发或进展后治疗'},{v:'术后辅助治疗'},{v:'新辅助治疗'},{v:'其他'},{v:'不清楚'}] },
      q21: { no:'Q21', module:'base', type:'text', required:true, title:'当前治疗方案',
             script:'我帮您核对一下医生目前安排的治疗方案。', placeholder:'记录医生方案，不评价方案' },
      q22: { no:'Q22', module:'base', type:'text', required:false, title:'首次使用拓益时间',
             script:'我帮您核对一下首次使用拓益的时间，精确到年月即可。', placeholder:'如：2026-03' },
      q23: { no:'Q23', module:'base', type:'date', required:false, title:'本院首次治疗日期',
             script:'我帮您核对一下在本院首次接受本品治疗的日期。' },
      q24: { no:'Q24', module:'base', type:'date', required:true, title:'院内确认下次治疗/复诊日期',
             script:'我根据院内信息和您刚才填写的时间，再确认一次下次治疗或复诊日期。' },
      q25: { no:'Q25', module:'base', type:'multi', required:false, title:'既往病史',
             script:'我再核对一下既往疾病情况，只记录随访需要的信息。',
             options:[{v:'无', exclusive:true},{v:'心血管疾病'},{v:'糖尿病'},{v:'高血压'},{v:'乙肝'},{v:'感染/带状疱疹'},{v:'肝肾功能异常'},{v:'自身免疫性疾病'},{v:'其他'}] },
      q26: { no:'Q26', module:'base', type:'multi', required:false, title:'合并用药情况',
             script:'我再核对一下目前是否合并使用其他药物，避免遗漏需要提示医生了解的信息。',
             options:[{v:'未合并使用其他药物', exclusive:true},{v:'抗生素'},{v:'糖皮质激素'},{v:'其他抗肿瘤药物'},{v:'抗病毒药物'},{v:'抗凝/抗血小板药物'},{v:'免疫抑制剂'},{v:'保健品'},{v:'其他'}] },
      q27: { no:'Q27', module:'base', type:'radio', required:true, title:'建档信息完整度',
             script:'我最后核对一下，本次建档信息是否都已经确认完整。',
             options:[{v:'信息完整'},{v:'信息缺失/待院内确认', note:'将标记暂缓管理并设置复核节点，待信息补齐后完成建档'}] },
      // 一般状态打开话匣
      q28: { no:'Q28', module:'general', type:'radio', required:true, title:'近期整体状态',
             script:'我先简单了解一下，您最近整体身体状态和之前相比怎么样？',
             options:[{v:'差不多'},{v:'比以前好'},{v:'比以前差', note:'建议重点关注后续安全性总筛'},{v:'不确定'}] },
      q29: { no:'Q29', module:'general', type:'radio', required:false, title:'体重变化',
             script:'最近体重有没有明显变化？大概增加还是减少？',
             options:[{v:'无显著变化'},{v:'轻微浮动'},{v:'明显增加'},{v:'明显降低'},{v:'不清楚'}] },
      q30: { no:'Q30', module:'general', type:'radio', required:false, title:'近期饮食情况',
             script:'最近吃饭情况怎么样？有没有食欲不好、吞咽困难或恶心呕吐影响进食？',
             options:[{v:'正常饮食'},{v:'食欲不佳'},{v:'吞咽困难'},{v:'恶心呕吐影响进食'},{v:'其他'}] },
      q31: { no:'Q31', module:'general', type:'radio', required:false, title:'近期活动/作息',
             script:'最近活动、作息和睡眠情况有没有明显变化？',
             options:[{v:'基本正常'},{v:'活动减少'},{v:'大部分时间卧床'},{v:'睡眠明显受影响'},{v:'其他'}] },
      // 治疗计划与复查管理
      q32: { no:'Q32', module:'plan', type:'radio', required:true, title:'医生确定的复查周期',
             script:'我确认一下，医生给您安排的复查周期是哪一种？',
             options:[{v:'按治疗周期复查'},{v:'月度复查'},{v:'季度复查'},{v:'半年度复查'},{v:'其他周期'},{v:'不清楚'}] },
      q33: { no:'Q33', module:'plan', type:'date', required:false, title:'最近一次应复查日期',
             script:'请确认最近一次应该复查的日期。' },
      q34: { no:'Q34', module:'plan', type:'radio', required:true, title:'最近是否按时复查',
             script:'最近这次复查是按时做了，还是计划往后延了？',
             options:[{v:'暂未到复查日期'},{v:'按时复查'},{v:'有复查计划但推迟', show:['q35']},{v:'不打算复查', show:['q35']},{v:'不清楚'}] },
      q35: { no:'Q35', module:'plan', type:'radio', required:true, title:'未按时/不复查原因', hidden:true,
             script:'方便说一下这次没有按时复查的主要原因吗？我只是帮您记录，不评价这个决定。',
             options:[{v:'有事耽搁'},{v:'挂不到号'},{v:'经济原因'},{v:'病情稳定主动延后'},{v:'感觉方案无效'},{v:'身体不适或副作用', note:'涉及身体不适时，安全性总筛请选择"有"并展开'},{v:'交通/外地'},{v:'其他'},{v:'不清楚'}] },
      q36: { no:'Q36', module:'plan', type:'radio', required:true, title:'下次复诊预约状态',
             script:'下次复诊或治疗现在已经预约好了吗？',
             options:[{v:'已预约'},{v:'未预约', show:['q37']},{v:'正在预约', show:['q37']},{v:'不清楚'}] },
      q37: { no:'Q37', module:'plan', type:'multi', required:true, title:'复诊/治疗困难', hidden:true,
             script:'目前在挂号、检查预约、交通或时间安排上有没有困难？（不得承诺加号、优先就诊或检查预约）',
             options:[{v:'无困难', exclusive:true},{v:'挂号困难'},{v:'检查预约困难'},{v:'交通/外地'},{v:'时间冲突'},{v:'经济压力'},{v:'其他'}] },
      q38: { no:'Q38', module:'plan', type:'radio', required:true, title:'医嘱是否调整',
             script:'医生有没有调整这次治疗或复诊安排？',
             options:[{v:'未调整'},{v:'医生已调整'},{v:'患者自行调整', note:'请在依从性模块记录自行调整原因'},{v:'不清楚'}] },
      // 依从性与脱落风险干预
      q39: { no:'Q39', module:'compliance', type:'text', required:false, title:'当前医嘱用法用量',
             script:'我帮您核对一下医生目前安排的用法用量。', placeholder:'按患者或院内可确认信息记录' },
      q40: { no:'Q40', module:'compliance', type:'radio', required:true, title:'患者治疗状态',
             script:'我想确认一下，您现在是按医嘱治疗，还是有延后、减量或停药的情况？',
             options:[{v:'按医嘱治疗'},{v:'遵医嘱调整', show:['q41']},{v:'自行延后', show:['q42','q43']},{v:'自行减量', show:['q42','q43']},{v:'已停药', show:['q42','q43']},{v:'联系不上'},{v:'不清楚'}] },
      q41: { no:'Q41', module:'compliance', type:'radio', required:true, title:'医嘱调整原因', hidden:true,
             script:'如果是医生调整的，医生是怎么交代的？我帮您按原话记录。',

      base:       { title:'基础疾病与治疗信息', icon:'🧬', sub:'首触达建档一次性采集' },
      general:    { title:'一般状态（打开话匣）', icon:'💬', sub:'先聊近况，再进入正题' },
      plan:       { title:'治疗计划与复查管理', icon:'📆', sub:'' },
      compliance: { title:'依从性与脱落风险干预', icon:'🧭', sub:'' },
      safety:     { title:'安全性总筛', icon:'🛡️', sub:'每次随访必做，需主动确认' },
      ae:         { title:'AE基础信息与风险分级', icon:'🚨', sub:'安全性总筛阳性后展开' },
      outcome:    { title:'事件补充与结局更新', icon:'🔄', sub:'关联原事件，不重复建案' },
      concern:    { title:'患者关切', icon:'🙋', sub:'仅记录需求，按项目权限转接' },
      summary:    { title:'随访小结', icon:'✅', sub:'本次必填' }
    };

    const MODE_CONFIG = {
      cycle:   { title:'周期治疗/复诊随访', modules:['profile','general','plan','compliance','safety','ae','concern','summary'] },
      profile: { title:'首触达建档', modules:['profile','base','plan','safety','ae','summary'] },
      ae:      { title:'异常症状/AE即时随访', modules:['profile','safety','ae','outcome','summary'] }
    };

    /* ================= 页面状态 ================= */
    const params = new URLSearchParams(location.search);
    const mode = MODE_CONFIG[params.get('mode')] ? params.get('mode') : 'cycle';
    const cfg = MODE_CONFIG[mode];
    const taskId = params.get('taskId') || '';
    const task = taskId ? App.getTaskById(taskId) : null;
    const answers = {};           // qid -> value(s)
    let safetyConfirmed = false;  // Q48 必须主动确认
    let skipToSummary = false;    // Q9 未联系到

    const TODAY = new Date().toISOString().slice(0, 10);
    const FOLLOWUP_NO = 'TY-FU-' + TODAY.replace(/-/g, '') + '-' + (taskId ? taskId.replace('t', '0') : '001');

    /* ================= 渲染 ================= */
    function escapeHtml(t) {
      return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderHeader() {
      document.getElementById('pageTitle').innerText = cfg.title;
      const tt = task ? App.getTaskType(task.type) : App.getTaskType(mode === 'ae' ? 'ae' : (mode === 'profile' ? 'profile' : 'cycle'));
      const tag = document.getElementById('taskTypeTag');
      tag.innerText = tt.icon + ' ' + tt.label;
      tag.style.background = tt.bg; tag.style.color = tt.color;

      const pName = task ? task.patient : (params.get('patient') || '沈*浩');
      const pMeta = task ? `${task.gender} · ${task.age}岁 · ${task.disease} · ${task.cycle !== '-' ? task.cycle + '周期' : ''} · ${task.dept}` : '演示模式 · 未关联任务';
      document.getElementById('patientName').innerText = pName;
      document.getElementById('patientAvatar').innerText = pName.charAt(0);
      document.getElementById('patientMeta').innerText = pMeta;

      if (mode === 'ae' && task && task.report) {
        document.getElementById('reportCard').classList.remove('hidden');
        document.getElementById('reportText').innerText = task.report;
        document.getElementById('reportTime').innerText = (task.source || '') + ' · ' + (task.sourceTime || '');
      }
      document.getElementById('submitBtn').innerText = mode === 'ae' ? '提交并生成异常记录' : '提交随访记录';
    }

    function renderSysFields() {
      const user = App.getUser();
      const fields = [
        ['项目随访号', FOLLOWUP_NO],
        ['本次随访日期', TODAY],
        ['执行人', user.name + '（项目专员）'],
        ['患者编号', task ? 'TY-PT-0' + task.id.replace('t','') + '8' : 'TY-PT-0102'],
        ['就诊医院', task ? user.hospital : user.hospital],
        ['就诊科室', task ? task.dept : user.dept],
        ['性别', task ? task.gender : '男'],
        ['年龄', task ? task.age + ' 岁' : '52 岁']
      ];
      return `<div class="question-card">
        <div class="question-head">
          <span class="question-no">系统</span>
          <div class="question-title">建档信息核对 <span style="font-size:11px;color:var(--text-muted);font-weight:400;">（系统自动带入，专员核对，无需向患者提问）</span></div>
        </div>
        <div class="sys-field-grid">
          ${fields.map(f => `<div class="sys-field"><div class="k">${f[0]}</div><div class="v">${f[1]}</div></div>`).join('')}
        </div>
      </div>`;
    }

    function renderQuestion(qid) {
      const q = Q[qid];
      const hiddenCls = q.hidden ? ' hidden' : '';
      const branchCls = q.branch ? ' branch' : '';
      let body = '';
      if (q.type === 'radio' || q.type === 'multi') {
        const inputType = q.type === 'multi' ? 'checkbox' : 'radio';
        body = `<div class="option-list">` + q.options.map((o, i) => `
          <label class="option-item ${o.preselect && q.safety ? 'preselect' : ''}" data-qid="${qid}">
            <input type="${inputType}" name="q_${qid}" value="${escapeHtml(o.v)}" data-oidx="${i}">
            <span class="option-text">${escapeHtml(o.v)}</span>
            ${o.urgent ? '<span class="urgent-dot">紧急</span>' : ''}
          </label>`).join('') + `</div>`;
      } else if (q.type === 'text') {
        body = `<input type="text" class="text-input" name="q_${qid}" placeholder="${q.placeholder || '请填写'}">`;
      } else if (q.type === 'textarea') {
        body = `<textarea class="extra-input" name="q_${qid}" placeholder="${q.placeholder || '请填写'}"></textarea>`;
      } else if (q.type === 'date') {
        body = `<input type="date" class="date-input" name="q_${qid}">`;
      }
      const noteArea = `<div class="cond-note hidden" id="note_${qid}"></div>`;
      const safetyHint = q.safety ? `<div class="safety-hint" id="safetyHint">⚠️ 系统默认展示"未出现"，请专员主动与患者确认实际情况后，重新点击选项完成确认。</div>` : '';
      return `
        <div class="question-card${branchCls}${hiddenCls}" id="card_${qid}">
          <div class="question-head">
            <span class="question-no">${q.no}</span>
            <div class="question-title">${escapeHtml(q.title)}${q.required ? '<span class="required">*</span>' : ''}</div>
            <button type="button" class="script-btn" data-qid="${qid}">📖 话术</button>
          </div>
          ${body}
          ${safetyHint}
          ${noteArea}
          <div class="error-tip">请完成本题后再提交</div>
        </div>`;
    }

    function renderForm() {
      const root = document.getElementById('formRoot');
      let html = '';
      cfg.modules.forEach(mk => {
        const m = MODULES[mk];
        const qids = Object.keys(Q).filter(k => Q[k].module === mk);
        const condCls = (mk === 'ae' && mode !== 'ae') ? ' cond-hidden' : '';
        html += `<div class="module-block${condCls}" id="mod_${mk}">
          <div class="module-head">
            <div class="module-icon">${m.icon}</div>
            <div><div class="module-title">${m.title}</div>${m.sub ? `<div class="module-sub">${m.sub}</div>` : ''}</div>
          </div>
          ${mk === 'profile' ? renderSysFields() : ''}
          ${qids.map(renderQuestion).join('')}
        </div>`;
      });
      root.innerHTML = html;
    }

    /* ================= 交互逻辑 ================= */
    function openScript(qid) {
      const q = Q[qid];
      document.getElementById('sheetQ').innerText = q.no + ' · ' + q.title;
      document.getElementById('sheetScript').innerText = q.script || '本题暂无配置话术。';
      document.getElementById('scriptSheet').classList.add('active');
    }
    function closeScript() { document.getElementById('scriptSheet').classList.remove('active'); }

    function getOption(qid, value) {
      return (Q[qid].options || []).find(o => o.v === value);
    }

    function setQuestionVisible(qid, visible) {
      const card = document.getElementById('card_' + qid);
      if (!card) return;
      card.classList.toggle('hidden', !visible);
      if (!visible) clearAnswer(qid);
    }

    function clearAnswer(qid) {
      delete answers[qid];
      document.querySelectorAll(`input[name="q_${qid}"]`).forEach(i => { i.checked = false; });
      document.querySelectorAll(`.option-item[data-qid="${qid}"]`).forEach(l => l.classList.remove('checked'));
      const t = document.querySelector(`textarea[name="q_${qid}"], input.text-input[name="q_${qid}"], input.date-input[name="q_${qid}"]`);
      if (t) t.value = '';
      // 级联收起子问题
      (Q[qid].options || []).forEach(o => (o.show || []).forEach(child => setQuestionVisible(child, false)));
    }

    function handleOption(qid, changedEl) {
      const q = Q[qid];

      // 互斥选项（无以上情况等）：以本次点击的选项为准
      if (q.type === 'multi' && changedEl) {
        const clickedOpt = getOption(qid, changedEl.value);
        if (clickedOpt && clickedOpt.exclusive && changedEl.checked) {
          document.querySelectorAll(`input[name="q_${qid}"]`).forEach(i => { if (i !== changedEl) i.checked = false; });
        } else if (changedEl.checked) {
          document.querySelectorAll(`input[name="q_${qid}"]`).forEach(i => {
            const o = getOption(qid, i.value);
            if (o && o.exclusive) i.checked = false;
          });
        }
      }

      const values = Array.from(document.querySelectorAll(`input[name="q_${qid}"]:checked`)).map(i => i.value);
      answers[qid] = q.type === 'multi' ? values : (values[0] || undefined);
      if (answers[qid] === undefined || (Array.isArray(answers[qid]) && !answers[qid].length)) delete answers[qid];

      // 样式
      document.querySelectorAll(`.option-item[data-qid="${qid}"]`).forEach(label => {
        const input = label.querySelector('input');
        label.classList.toggle('checked', input.checked);
        if (q.safety) label.classList.remove('preselect');
      });

      // Q48 主动确认
      if (q.safety && values.length) {
        safetyConfirmed = true;
        const hint = document.getElementById('safetyHint');
        hint.classList.add('ok');
        hint.innerText = '✅ 已完成安全性总筛主动确认。';
      }

      // 条件展开：单选按选中项展开，多选合并展开
      if (q.options) {
        const toShow = new Set();
        values.forEach(v => (getOption(qid, v).show || []).forEach(s => toShow.add(s)));
        const allChildren = new Set();
        q.options.forEach(o => (o.show || []).forEach(s => allChildren.add(s)));
        allChildren.forEach(child => setQuestionVisible(child, toShow.has(child)));
      }

      // 选项备注提示
      const noteEl = document.getElementById('note_' + qid);
      if (noteEl) {
        const notes = values.map(v => getOption(qid, v)).filter(o => o && o.note).map(o => '💡 ' + o.note);
        noteEl.classList.toggle('hidden', !notes.length);
        noteEl.innerHTML = notes.join('<br>');
      }

      // Q9 特殊动作
      if (qid === 'q9') {
        const v = values[0];
        if (v === '患者拒绝随访') {
          if (confirm('患者拒绝随访，将进入「退出/拒访管理」流程。\n（当次获知的安全性信息仍需记录转交）')) {
            location.href = 'withdraw-form.html?taskId=' + taskId + '&patient=' + encodeURIComponent(document.getElementById('patientName').innerText);
            return;
          }
        }
        skipToSummary = (v === '未联系到');
        cfg.modules.forEach(mk => {
          if (['profile','summary'].includes(mk)) return;
          document.getElementById('mod_' + mk).classList.toggle('cond-hidden', skipToSummary || (mk === 'ae' && mode !== 'ae' && !aeVisible()));
        });
      }

      // Q49 → AE 模块 / 特殊情形提示
      if (qid === 'q49') updateAeVisibility(values);

      // Q121 → Q122
      if (qid === 'q121') {
        const need = values.some(v => getOption('q121', v).escalate);
        setQuestionVisible('q122', need);
      }

      updateUrgentBanner();
      updateProgress();
      const card = document.getElementById('card_' + qid);
      if (card) card.classList.remove('error');
    }

    function aeVisible() {
      const vals = answers['q49'] || [];
      return vals.some(v => { const o = getOption('q49', v); return o && o.aeTrigger; });
    }

    function updateAeVisibility(values) {
      const showAe = mode === 'ae' || aeVisible();
      document.getElementById('mod_ae').classList.toggle('cond-hidden', !showAe || skipToSummary);
      // 特殊情形提示
      const special = values.filter(v => getOption('q49', v).specialNote);
      const noteEl = document.getElementById('note_q49');
      let html = '';
      if (special.length) html += '💡 已选择特殊情形类信息（' + special.join('、') + '），将按「特殊情形/PV分流」流程转交专业团队。';
      if (aeVisible()) html += (html ? '<br>' : '') + '🚨 已触发「AE基础信息与风险分级」模块，请继续完成下方分级追问。';
      noteEl.classList.toggle('hidden', !html);
      noteEl.innerHTML = html;
    }

    function handleText(qid) {
      const el = document.querySelector(`[name="q_${qid}"]`);
      answers[qid] = el.value.trim() || undefined;
      if (!answers[qid]) delete answers[qid];
      document.getElementById('card_' + qid).classList.remove('error');
      updateProgress();
    }

    function updateUrgentBanner() {
      let urgent = false;
      Object.keys(answers).forEach(qid => {
        const q = Q[qid];
        if (!q.options) return;
        const vals = Array.isArray(answers[qid]) ? answers[qid] : [answers[qid]];
        vals.forEach(v => { const o = getOption(qid, v); if (o && o.urgent) urgent = true; });
      });
      document.getElementById('urgentBanner').classList.toggle('hidden', !urgent);
      return urgent;
    }

    function isAnswered(qid) {
      const q = Q[qid];
      const card = document.getElementById('card_' + qid);
      if (!card || card.classList.contains('hidden')) return true;
      if (q.module && document.getElementById('mod_' + q.module).classList.contains('cond-hidden')) return true;
      if (q.safety) return safetyConfirmed;
      const v = answers[qid];
      if (Array.isArray(v)) return v.length > 0;
      return v !== undefined && v !== '';
    }

    function visibleRequired() {
      return cfg.modules.flatMap(mk => Object.keys(Q).filter(k => Q[k].module === mk))
        .filter(qid => Q[qid].required && !isSkipped(qid));
    }

    function isSkipped(qid) {
      const q = Q[qid];
      const card = document.getElementById('card_' + qid);
      if (card && card.classList.contains('hidden')) return true;
      if (q.module && document.getElementById('mod_' + q.module).classList.contains('cond-hidden')) return true;
      return false;
    }

    function updateProgress() {
      const req = visibleRequired();
      const done = req.filter(qid => isAnswered(qid)).length;
      document.getElementById('progressText').innerText = `已完成 ${done} / ${req.length}`;
      document.getElementById('progressBar').style.width = req.length ? (done / req.length * 100) + '%' : '0%';
    }

    /* ================= 提交 ================= */
    function submitForm() {
      // 安全性总筛主动确认校验
      if (!skipToSummary && !safetyConfirmed) {
        const card = document.getElementById('card_q48');
        if (card && !isSkipped('q48')) {
          card.classList.add('error');
          card.querySelector('.error-tip').innerText = '请主动确认安全性总筛选项（即使默认"未出现"也需重新点击确认）';
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
      }
      // 必填校验
      let firstInvalid = null;
      visibleRequired().forEach(qid => {
        const invalid = !isAnswered(qid);
        const card = document.getElementById('card_' + qid);
        if (card) {
          card.classList.toggle('error', invalid);
          if (invalid) card.querySelector('.error-tip').innerText = '请完成本题后再提交';
        }
        if (invalid && !firstInvalid) firstInvalid = card;
      });
      if (firstInvalid) {
        firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const urgent = updateUrgentBanner();
      const escalate = (answers['q121'] || []).filter(v => v !== '无需升级');
      const record = {
        taskId, mode,
        followupNo: FOLLOWUP_NO,
        patient: document.getElementById('patientName').innerText,
        taskType: cfg.title,
        summary: answers['q118'] || '',
        nextDate: answers['q119'] || '',
        escalate: escalate.length ? escalate : ['无需升级'],
        urgent,
        answers
      };
      App.saveFollowupRecord(record);

      if (mode === 'ae') {
        alert('✅ 已生成异常记录，项目经理将跟进。\n' + (urgent ? '🚨 本次含紧急升级线索，请尽快同步项目经理 / PV 接口人。' : ''));
      } else {
        alert('✅ 随访记录已提交！' + (urgent ? '\n🚨 本次含紧急升级线索，请尽快同步项目经理 / PV 接口人。' : ''));
      }
      location.href = 'task-list.html';
    }

    /* ================= 事件委托 ================= */
    document.getElementById('formRoot').addEventListener('change', e => {
      const el = e.target;
      const name = el.getAttribute && el.getAttribute('name');
      if (!name || !name.startsWith('q_')) return;
      const qid = name.slice(2);
      if (el.type === 'radio' || el.type === 'checkbox') handleOption(qid, el);
      else handleText(qid);
    });
    document.getElementById('formRoot').addEventListener('input', e => {
      const el = e.target;
      const name = el.getAttribute && el.getAttribute('name');
      if (!name || !name.startsWith('q_')) return;
      if (el.tagName === 'TEXTAREA' || el.type === 'text') handleText(name.slice(2));
    });
    document.getElementById('formRoot').addEventListener('click', e => {
      const btn = e.target.closest('.script-btn');
      if (btn) openScript(btn.dataset.qid);
    });

    /* ================= 初始化 ================= */
    renderHeader();
    renderForm();
    // AE 即时随访模式：AE 模块常驻展开，安全性总筛待专员确认
    if (mode === 'ae') {
      document.getElementById('mod_ae').classList.remove('cond-hidden');
    }
    updateProgress();
  </script>
</body>
</html>
