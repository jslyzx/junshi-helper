<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>任务管理 - 项目专员端</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .search-bar {
            background: white; border-radius: 12px; height: 44px; display: flex; align-items: center;
            padding: 0 16px; margin-bottom: 14px; border: 1px solid #E5E6EB;
        }
        .search-bar input { border: none; outline: none; flex: 1; font-size: 14px; margin-left: 8px; }

        .tabs-scroll {
            display: flex; overflow-x: auto; gap: 10px; margin-bottom: 16px; padding-bottom: 8px;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .tabs-scroll::-webkit-scrollbar { display: none; }
        .tab-chip {
            flex-shrink: 0; padding: 8px 14px; border-radius: 999px; font-size: 12px;
            background: white; border: 1px solid #E5E6EB; color: var(--text-secondary);
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .tab-chip .cnt {
            min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
            background: #F2F3F5; color: var(--text-muted); font-size: 10px; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .tab-chip.active { color: white; font-weight: 700; border-color: transparent; }
        .tab-chip.active .cnt { background: rgba(255,255,255,0.25); color: white; }

        .status-tabs { display: flex; gap: 20px; margin-bottom: 14px; }
        .status-tab {
            font-size: 14px; color: var(--text-muted); cursor: pointer; padding-bottom: 4px;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .status-tab.active { color: var(--primary-color); font-weight: 700; border-bottom-color: var(--primary-color); }

        .task-card {
            background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
            border: 1px solid #F0F2F5; transition: transform 0.2s; cursor: pointer;
        }
        .task-card:active { transform: scale(0.98); background: var(--primary-soft); }
        .task-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .type-tag {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
        }
        .task-date { font-size: 11px; font-weight: 700; }
        .task-patient-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .task-p-name { font-size: 15px; font-weight: 700; color: var(--text-main); }
        .task-p-meta { font-size: 11px; color: var(--text-muted); font-weight: 400; }
        .task-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 8px; }
        .task-bottom { display: flex; justify-content: space-between; align-items: center; }
        .status-label { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 700; }
        .st-pending { background: #FFF2E6; color: #E37318; }
        .st-overdue { background: #FDEEEE; color: #D54941; }
        .st-done { background: #EAF7F1; color: #2BA471; }
        .source-tag { font-size: 10px; color: var(--danger-color); font-weight: 700; }
        .empty-box { text-align: center; padding: 50px 0; color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="back-btn" onclick="location.href='index.html'">✕</div>
        <h1>任务管理</h1>
        <div style="width: 32px;"></div>
    </div>

    <div class="container" style="padding-top: 16px;">
        <!-- 搜索 -->
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="搜索患者姓名、疾病" oninput="applyFilter()">
        </div>

        <!-- 9 类任务筛选 -->
        <div class="tabs-scroll" id="typeTabs"></div>

        <!-- 状态筛选 -->
        <div class="status-tabs">
            <div class="status-tab active" data-status="all" onclick="switchStatus(this)">全部状态</div>
            <div class="status-tab" data-status="pending" onclick="switchStatus(this)">待处理</div>
            <div class="status-tab" data-status="overdue" onclick="switchStatus(this)">已超期</div>
            <div class="status-tab" data-status="done" onclick="switchStatus(this)">已完成</div>
        </div>

        <!-- 任务列表 -->
        <div id="taskListContent"></div>
    </div>

    <!-- 底部 Tab 栏 -->
    <nav class="tab-bar">
        <a href="index.html" class="tab-item">
            <span class="tab-icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="task-list.html" class="tab-item active">
            <span class="tab-icon" style="position: relative;">📋 <span class="badge" id="navBadge">14</span></span>
            <span>任务管理</span>
        </a>
        <a href="patient-list.html" class="tab-item">
            <span class="tab-icon">👥</span>
            <span>患者管理</span>
        </a>
        <a href="report-center.html" class="tab-item">
            <span class="tab-icon">📊</span>
            <span>数据报表</span>
        </a>
        <a href="my.html" class="tab-item">
            <span class="tab-icon">👤</span>
            <span>我的</span>
        </a>
    </nav>

    <script src="js/app.js"></script>
    <script>
        let curType = 'all';
        let curStatus = 'all';

        const TASK_ROUTE = {
            auth:     t => `task-detail.html?id=${t.id}`,
            profile:  t => `followup-form.html?mode=profile&taskId=${t.id}`,
            cycle:    t => `followup-form.html?mode=cycle&taskId=${t.id}`,
            recall:   t => `recall-form.html?taskId=${t.id}&patient=${encodeURIComponent(t.patient)}`,
            withdraw: t => `withdraw-form.html?taskId=${t.id}`,
            ae:       t => `followup-form.html?mode=ae&taskId=${t.id}`,
            special:  t => `complaint-list.html?taskId=${t.id}`,
            pv:       t => `abnormal-form.html?taskId=${t.id}&patient=${encodeURIComponent(t.patient)}`,
            patient:  t => `task-detail.html?id=${t.id}`
        };

        function renderTypeTabs() {
            const types = App.getTaskTypes();
            const tasks = App.getTasks();
            const pending = tasks.filter(t => t.status !== 'done');
            const countOf = key => key === 'all' ? pending.length : pending.filter(t => t.type === key).length;

            const allChip = `<div class="tab-chip ${curType === 'all' ? 'active' : ''}" data-key="all"
                style="${curType === 'all' ? 'background: var(--primary-gradient);' : ''}"
                onclick="switchType('all')">全部 <span class="cnt">${countOf('all')}</span></div>`;

            const chips = types.map(tt => {
                const active = curType === tt.key;
                return `<div class="tab-chip ${active ? 'active' : ''}" style="${active ? `background: ${tt.color};` : ''}"
                    onclick="switchType('${tt.key}')">${tt.icon} ${tt.label} <span class="cnt">${countOf(tt.key)}</span></div>`;
            }).join('');
            document.getElementById('typeTabs').innerHTML = allChip + chips;
        }

        function switchType(key) {
            curType = key;
            renderTypeTabs();
            applyFilter();
        }

        function switchStatus(el) {
            document.querySelectorAll('.status-tab').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            curStatus = el.dataset.status;
            applyFilter();
        }

        function applyFilter() {
            const keyword = document.getElementById('searchInput').value.trim();
            let tasks = App.getTasks();
            if (curType !== 'all') tasks = tasks.filter(t => t.type === curType);
            if (curStatus === 'pending') tasks = tasks.filter(t => t.status === 'pending');
            else if (curStatus === 'overdue') tasks = tasks.filter(t => t.status === 'overdue');
            else if (curStatus === 'done') tasks = tasks.filter(t => t.status === 'done');
            else tasks = tasks.filter(t => t.status !== 'done').concat(tasks.filter(t => t.status === 'done'));
            if (keyword) tasks = tasks.filter(t => t.patient.includes(keyword) || t.disease.includes(keyword));
            renderTasks(tasks);
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskListContent');
            if (!tasks.length) {
                list.innerHTML = '<div class="empty-box">📭<br><br>暂无符合条件的任务</div>';
                return;
            }
            list.innerHTML = tasks.map(t => {
                const tt = App.getTaskType(t.type);
                const isDone = t.status === 'done';
                const isOverdue = t.status === 'overdue';
                const dateColor = isDone ? 'var(--text-muted)' : (isOverdue || t.planDate === '紧急' ? 'var(--danger-color)' : 'var(--primary-color)');
                const stLabel = isDone ? '已完成' : (isOverdue ? '已超期' : '待处理');
                const stClass = isDone ? 'st-done' : (isOverdue ? 'st-overdue' : 'st-pending');
                const route = isDone ? `task-detail.html?id=${t.id}` : TASK_ROUTE[t.type](t);
                return `
                <div class="task-card animate-up ${t.type === 'ae' && !isDone ? 'is-abnormal' : ''}" onclick="App.navigateTo('${route}')">
                    <div class="task-top">
                        <span class="type-tag" style="background:${tt.bg}; color:${tt.color};">${tt.icon} ${tt.label}</span>
                        <span class="task-date" style="color:${dateColor};">${isDone ? '已完成' : '计划：' + t.planDate}</span>
                    </div>
                    <div class="task-patient-row">
                        <span class="task-p-name">${t.patient} <span class="task-p-meta">${t.gender} · ${t.age}岁 · ${t.disease} · ${t.cycle !== '-' ? t.cycle + '周期' : '未用药'}</span></span>
                    </div>
                    <div class="task-desc">${t.desc}</div>
                    <div class="task-bottom">
                        <span class="status-label ${stClass}">${stLabel}</span>
                        ${t.type === 'ae' && !isDone ? `<span class="source-tag">来源：${t.source}</span>` : `<span style="font-size:11px; color:var(--text-muted)">${t.dept}</span>`}
                    </div>
                </div>`;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('type')) curType = params.get('type');
            const stats = App.getTaskStats();
            document.getElementById('navBadge').innerText = stats.pending;
            renderTypeTabs();
            applyFilter();
        });
    </script>
</body>
</html>
